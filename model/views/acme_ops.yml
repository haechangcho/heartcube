views:
  - name: acme_ops
    title: ACME Insurance Operations
    description: >
      Unified view of ACME Insurance claims, policies, payments, and party data.
      Access all members via single prefix (acme_ops.*).

    cubes:
      # ── acme_claim (base cube) ────────────────────────────────────────────
      - join_path: acme_claim
        includes:
          - name: claims
            alias: claim_count
          - company_claim_number
          - claim_status_code
          - claims_made_date
          - claim_open_date
          - claim_close_date
          - avg_days_to_settle

      # ── acme_catastrophe ──────────────────────────────────────────────────
      - join_path: acme_claim.acme_catastrophe
        includes:
          - catastrophe_name
          - catastrophe_type_code

      # ── acme_claim_amount ─────────────────────────────────────────────────
      - join_path: acme_claim.acme_claim_amount
        includes:
          - total_claim_amount
          - loss_payment_amount
          - loss_reserve_amount
          - total_loss_amount

      # ── acme_policy ───────────────────────────────────────────────────────
      - join_path: acme_claim.acme_claim_coverage.acme_policy_coverage_detail.acme_policy
        includes:
          - policy_number
          - status_code
          - name: number_of_policies
            alias: policy_count

      # ── acme_agreement_party_role ─────────────────────────────────────────
      - join_path: acme_claim.acme_claim_coverage.acme_policy_coverage_detail.acme_policy.acme_agreement_party_role
        includes:
          - party_identifier
          - party_role_code
          - policy_count_by_agent

      # ── acme_policy_amount ────────────────────────────────────────────────
      - join_path: acme_claim.acme_claim_coverage.acme_policy_coverage_detail.acme_policy.acme_policy_amount
        includes:
          - total_policy_amount

      # ── acme_premium ──────────────────────────────────────────────────────
      - join_path: acme_claim.acme_claim_coverage.acme_policy_coverage_detail.acme_policy.acme_policy_amount.acme_premium
        includes:
          - has_premium
