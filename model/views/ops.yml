views:
  - name: ops
    title: 보험 청구 운영 조회
    description: >
      보험 청구·심사·지급·계약·진료·고객 데이터를 통합한 운영 분석 뷰.
      사고 단위 목록 조회, 필터링, 집계 분석에 사용한다.
      전략 KPI 분석(경영 의사결정 목적)은 kpi 뷰를 사용한다.

    cubes:
      # ── fact_accident (기준 큐브) ─────────────────────────────────────────
      - join_path: fact_accident
        includes:
          - accident_no
          - accident_dt
          - claim_dt
          - payment_dt
          - accident_type_l1
          - accident_type_l2
          - accident_type_l3
          - customer_id
          - accident_claim_gap_days

          - name: count
            alias: claim_count
            title: 청구건수

          - claim_approval_rate
          - loss_ratio
          - anomaly_rate
          - overpayment_amt
          - review_reversal_count
          - review_reversal_rate
          - high_prior_claim_count

      # ── fact_payment ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_payment
        includes:
          - final_coverage_nm
          - final_payment_cd
          - payment_type
          - payment_item_l1
          - reduction_reason
          - claim_amt
          - payment_amt
          - total_claim_amt
          - total_payment_amt
          - total_reduction_amt
          - avg_payment_amt

          - name: count
            alias: payment_count
            title: 지급건수

          - reduction_count
          - reduction_rate

          - name: payment_rate
            title: 청구인용율(금액기준, %)

      # ── fact_review ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_review
        includes:
          - processing_biz_days
          - anomaly_label
          - claim_center_nm
          - claim_team_nm

          - name: adjuster_id
            title: 담당자사번

          - org_type
          - review_yn
          - lawsuit_yn
          - sla_breached

          - name: count
            alias: inspect_count
            title: 심사건수

          - anomaly_count
          - fraud_suspect_count
          - overpayment_count
          - review_count
          - avg_processing_days
          - overpayment_rate
          - sla_compliance_rate
          - sla_breach_count
          - fraud_suspicion_rate
          - review_rate
          - lawsuit_rate
          - payment_delay_rate
          - duplicate_payment_rate
          - error_payment_rate

      # ── fact_contract ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract
        includes:
          - sales_division
          - sales_org_cd
          - insured_amt
          - total_insured_amt

      # ── fact_treatment ────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment
        includes:
          - dx_analysis_l1
          - dx_analysis_l2
          - treatment_pattern
          - inpatient_period_grp
          - noninsured_ratio
          - avg_inpatient_days
          - total_treat_amt_noninsured
          - total_treat_amt

      # ── dim_customer ──────────────────────────────────────────────────────
      - join_path: fact_accident.dim_customer
        includes:
          - gender
          - age_group

      # ── dim_coverage ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_coverage
        includes:
          - coverage_nm
          - coverage_type
          - coverage_cat1
          - coverage_cat2

      # ── dim_product ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_product
        includes:
          - product_nm

      # ── dim_hospital ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_hospital
        includes:
          - hospital_nm
          - hospital_grade_cd

      # ── dim_diagnosis ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_diagnosis
        includes:
          - diagnosis_nm
          - diagnosis_type
