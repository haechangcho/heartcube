views:
  - name: kpi
    title: KPI 통합
    description: >
      보험 운영 의사결정을 위한 KPI 통합 뷰.
      fact_accident를 기준으로 모든 fact/dim 테이블을 join_path로 연결하여
      손해율·청구인용율·SLA준수율 등 모든 KPI와 드라이버 차원을 kpi.* 단일 prefix로 조회 가능.
      수익성(P), 지급품질(Q), 운영효율(E) 세 축으로 분석한다.

    cubes:
      # ── fact_accident (기준 큐브) ─────────────────────────────────────────
      - join_path: fact_accident
        includes:
          - name: count
            alias: claim_count

          - accident_dt
          - claim_dt
          - payment_dt
          - accident_type_l1
          - accident_type_l2
          - accident_type_l3
          - accident_claim_gap_days
          - prior_claim_grp

          - name: loss_ratio
            meta:
              kpi:
                visible: true
                target: "40% 이하"
              driver:
                - measure: claim_count
                - measure: avg_payment_amt
                - measure: claim_approval_rate
              lever:
                - context: [claim_count]
                  measure: total_insured_amt
                  action: "청구 집중 담보 가입금액 강화"
                - context: [avg_payment_amt]
                  measure: review_rate
                  action: "고지급 건 재심 강화"
                - context: [claim_approval_rate]
                  dimension: adjuster_id
                  action: "인용율 높은 심사자 배당 정책 조정"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - claim_approval_rate

          - name: overpayment_rate
            meta:
              kpi:
                visible: true
                target: "2% 이하"
              driver:
                - dimension: hospital_grade_cd
                - dimension: noninsured_item
                - dimension: adjuster_id
                - measure: avg_processing_days
              lever:
                - context: [noninsured_item]
                  measure: total_insured_amt
                  action: "비급여항목별 가입금액 기준 강화"
                - context: [adjuster_id]
                  dimension: adjuster_id
                  action: "과지급 다발 심사자 재교육"
                - context: [hospital_grade_cd, noninsured_item]
                  measure: review_rate
                  action: "고위험 병원·비급여 조합 재심 강화"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - sla_compliance_rate

          - name: avg_processing_days
            meta:
              kpi:
                visible: true
                target: "5일 이내"
              driver:
                - dimension: adjuster_id
                - dimension: claim_team_nm
                - dimension: org_type
              lever:
                - context: [adjuster_id]
                  measure: claim_count
                  action: "처리 지연 심사자 담당 건수 재배분"
                - context: [claim_team_nm]
                  measure: claim_count
                  action: "저효율 팀 담당 건수 재배분"
                - context: [org_type]
                  dimension: accident_type_l1
                  action: "처리 지연 조직의 주요 사고유형 간편심사 전환"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: anomaly_rate
            meta:
              kpi:
                visible: true
              driver:
                - dimension: anomaly_label
                - dimension: claim_center_nm
              lever:
                - context: [anomaly_label]
                  measure: claim_count
                  action: "이상유형별 건수 집중 심사 프로세스 강화"
                - context: [claim_center_nm]
                  measure: claim_count
                  action: "고탐지율 센터 집중 감사"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - name: fraud_suspicion_rate
            meta:
              kpi:
                visible: true
                target: "1% 이하"
              driver:
                - dimension: prior_claim_grp
                - dimension: hospital_nm
                - dimension: treatment_pattern
              lever:
                - context: [prior_claim_grp]
                  dimension: adjuster_id
                  action: "상습청구 고객 SIU 배정"
                - context: [hospital_nm]
                  measure: claim_count
                  action: "의심 병원 집중심사 및 지급 보류"
                - context: [treatment_pattern]
                  dimension: hospital_nm
                  action: "이상 치료패턴 다발 병원 집중심사"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: noninsured_ratio
            meta:
              kpi:
                visible: true
              driver:
                - dimension: hospital_nm
                - dimension: dx_analysis_l1
                - dimension: treatment_pattern
              lever:
                - context: [hospital_nm]
                  measure: total_treat_amt_noninsured
                  action: "비급여 과다 병원 집중심사 및 현장 조사"
                - context: [dx_analysis_l1]
                  dimension: hospital_nm
                  action: "비급여 다발 진단 병원 지급기준 강화"
                - context: [treatment_pattern]
                  measure: total_treat_amt_noninsured
                  action: "이상 치료패턴 비급여 항목 지급기준 강화"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - review_reversal_count

          - name: review_reversal_rate
            meta:
              kpi:
                visible: true
              driver:
                - dimension: adjuster_id
                - dimension: coverage_nm
              lever:
                - context: [adjuster_id]
                  measure: review_reversal_count
                  action: "번복 다발 심사자 재교육"
                - context: [coverage_nm]
                  measure: total_insured_amt
                  action: "번복 집중 담보 심사 가이드라인 보완"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: high_prior_claim_count
            meta:
              kpi:
                visible: false
              driver:
                - dimension: hospital_nm
                - dimension: dx_analysis_l1
              lever:
                - action: "상습청구 고객 집중심사 지정"
                - action: "SIU 조사 의뢰"

      # ── fact_payment ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_payment
        includes:
          - total_payment_amt
          - total_claim_amt
          - total_reduction_amt
          - avg_payment_amt
          - reduction_count
          - name: reduction_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: coverage_nm
                  measure: reduction_rate
                - dimension: reduction_reason
                  measure: total_reduction_amt
              lever:
                - action: "감액 집중 담보 지급기준 명확화"
          - final_payment_cd
          - payment_type
          - payment_item_l1
          - reduction_reason

      # ── fact_contract ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract
        includes:
          - total_insured_amt
          - sales_division
          - sales_org_cd
          - product_cd
          - coverage_cd

      # ── fact_review ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_review
        includes:
          - claim_center_nm
          - claim_team_nm
          - adjuster_id
          - org_type
          - anomaly_label
          - review_yn
          - lawsuit_yn

          - name: payment_delay_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: claim_center_nm
                - dimension: accident_type_l1
                - measure: avg_processing_days
              lever:
                - action: "자동화 대상 사고유형 선정"
                - action: "간편심사 확대"

          - name: review_rate
            meta:
              kpi:
                visible: false
                target: "3% 이하"
              driver:
                - dimension: adjuster_id
                - dimension: coverage_nm
              lever:
                - action: "심사기준 명확화"
                - action: "과소지급 심사자 모니터링"
                - action: "심사 결과 커뮤니케이션 강화"

          - name: lawsuit_rate
            meta:
              kpi:
                visible: false
                target: "1% 이하"
              driver:
                - dimension: coverage_nm
                - dimension: claim_center_nm
                - dimension: review_yn
              lever:
                - action: "소송 집중 담보 지급기준 재정비"
                - action: "분쟁 조기 해소 프로세스 강화"

          - name: duplicate_payment_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: adjuster_id
                - dimension: claim_center_nm
              lever:
                - action: "중복지급 발생 단위 프로세스 점검"
                - action: "시스템 자동 중복 검증 강화"

          - name: error_payment_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: adjuster_id
                - dimension: coverage_nm
              lever:
                - action: "면책조항 미적용 오류 심사자 교육"
                - action: "지급 계산 자동화 확대"

      # ── fact_treatment ────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment
        includes:
          - dx_analysis_l1
          - dx_analysis_l2
          - treatment_pattern
          - inpatient_period_grp
          - avg_inpatient_days
          - total_treat_amt_noninsured
          - noninsured_item

      # ── dim_customer ──────────────────────────────────────────────────────
      - join_path: fact_accident.dim_customer
        includes:
          - gender
          - age_group

      # ── dim_coverage ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_coverage
        includes:
          - coverage_nm
          - coverage_type
          - coverage_cat1
          - coverage_cat2

      # ── dim_product ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_product
        includes:
          - product_nm

      # ── dim_hospital ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_hospital
        includes:
          - hospital_nm
          - hospital_grade_cd

      # ── dim_diagnosis ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_diagnosis
        includes:
          - diagnosis_nm
          - diagnosis_type
