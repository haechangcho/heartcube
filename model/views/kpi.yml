views:
  - name: kpi
    title: KPI 통합
    description: >
      보험 운영 의사결정을 위한 KPI 통합 뷰.
      fact_accident를 기준으로 모든 fact/dim 테이블을 join_path로 연결하여
      손해율·청구인용율·SLA준수율 등 모든 KPI와 드라이버 차원을 kpi.* 단일 prefix로 조회 가능.
      수익성(P), 지급품질(Q), 운영효율(E) 세 축으로 분석한다.

    cubes:
      # ── fact_accident (기준 큐브) ─────────────────────────────────────────
      - join_path: fact_accident
        includes:
          - name: count
            alias: claim_count

          - accident_dt
          - claim_dt
          - payment_dt
          - accident_type_l1
          - accident_type_l2
          - accident_type_l3
          - accident_claim_gap_days
          - prior_claim_grp

          - name: loss_ratio
            meta:
              kpi:
                visible: true
                target:
                  value: 40
                  unit: "%"
                  bound: upper
              driver:
                - measure: claim_count
                - measure: avg_payment_amt
                - measure: claim_approval_rate
              lever:
                - context: [claim_count]
                  analysis:
                    type: drill_down
                    by: [coverage_nm]
                    measure: total_insured_amt
                - context: [avg_payment_amt]
                  analysis:
                    type: drill_down
                    by: [adjuster_id]
                    measure: review_rate
                - context: [claim_approval_rate]
                  analysis:
                    type: peer_comparison
                    peer_group: [claim_center_nm]
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - claim_approval_rate

          - name: overpayment_rate
            meta:
              kpi:
                visible: true
                target:
                  value: 4
                  unit: "%"
                  bound: upper
              driver:
                - dimension: hospital_grade_cd
                - dimension: noninsured_item
                - dimension: adjuster_id
                - measure: avg_processing_days
              lever:
                - context: [noninsured_item]
                  analysis:
                    type: drill_down
                    by: [hospital_grade_cd]
                    measure: review_rate
                - context: [adjuster_id]
                  analysis:
                    type: peer_comparison
                    peer_group: [claim_center_nm]
                - context: [hospital_grade_cd]
                  analysis:
                    type: drill_down
                    by: [hospital_grade_cd]
                    measure: review_rate
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - sla_compliance_rate

          - name: avg_processing_days
            meta:
              kpi:
                visible: true
                target:
                  value: 5
                  unit: "일"
                  bound: upper
              driver:
                - dimension: adjuster_id
                - dimension: claim_team_nm
                - dimension: org_type
              lever:
                - context: [adjuster_id]
                  analysis:
                    type: peer_comparison
                    peer_group: [claim_center_nm]
                - context: [claim_team_nm]
                  analysis:
                    type: peer_comparison
                    peer_group: [claim_center_nm]
                - context: [org_type]
                  analysis:
                    type: drill_down
                    by: [accident_type_l1]
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: anomaly_rate
            meta:
              kpi:
                visible: true
              driver:
                - dimension: anomaly_label
                - dimension: claim_center_nm
              lever:
                - context: [anomaly_label]
                  analysis:
                    type: peer_comparison
                    peer_group: [org_type]
                - context: [claim_center_nm]
                  analysis:
                    type: peer_comparison
                    peer_group: [org_type]
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - fraud_suspicion_rate

          - name: noninsured_ratio
            meta:
              kpi:
                visible: true
              driver:
                - dimension: hospital_nm
                - dimension: dx_analysis_l1
                - dimension: treatment_pattern
              lever:
                - context: [hospital_nm]
                  analysis:
                    type: peer_comparison
                    peer_group: [hospital_grade_cd]
                - context: [dx_analysis_l1]
                  analysis:
                    type: drill_down
                    by: [dx_analysis_l2]
                - context: [treatment_pattern]
                  analysis:
                    type: drill_down
                    by: [treatment_pattern]
                    measure: total_treat_amt_noninsured
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - review_reversal_count

          - name: review_reversal_rate
            meta:
              kpi:
                visible: true
              driver:
                - dimension: adjuster_id
                - dimension: coverage_nm
              lever:
                - context: [adjuster_id]
                  analysis:
                    type: peer_comparison
                    peer_group: [claim_center_nm]
                - context: [coverage_nm]
                  analysis:
                    type: drill_down
                    by: [coverage_nm]
                    measure: total_insured_amt
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - high_prior_claim_count

      # ── fact_payment ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_payment
        includes:
          - total_payment_amt
          - total_claim_amt
          - total_reduction_amt
          - avg_payment_amt
          - reduction_count
          - reduction_rate
          - final_payment_cd
          - payment_type
          - payment_item_l1
          - reduction_reason

      # ── fact_contract ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract
        includes:
          - total_insured_amt
          - sales_division
          - sales_org_cd
          - product_cd
          - coverage_cd

      # ── fact_review ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_review
        includes:
          - claim_center_nm
          - claim_team_nm
          - adjuster_id
          - org_type
          - anomaly_label
          - review_yn
          - lawsuit_yn

          - payment_delay_rate
          - review_rate
          - lawsuit_rate
          - duplicate_payment_rate
          - error_payment_rate

      # ── fact_treatment ────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment
        includes:
          - dx_analysis_l1
          - dx_analysis_l2
          - treatment_pattern
          - inpatient_period_grp
          - avg_inpatient_days
          - total_treat_amt_noninsured
          - noninsured_item

      # ── dim_customer ──────────────────────────────────────────────────────
      - join_path: fact_accident.dim_customer
        includes:
          - gender
          - age_group

      # ── dim_coverage ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_coverage
        includes:
          - coverage_nm
          - coverage_type
          - coverage_cat1
          - coverage_cat2

      # ── dim_product ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_product
        includes:
          - product_nm

      # ── dim_hospital ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_hospital
        includes:
          - hospital_nm
          - hospital_grade_cd

      # ── dim_diagnosis ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_diagnosis
        includes:
          - diagnosis_nm
          - diagnosis_type
