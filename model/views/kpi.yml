views:
  - name: kpi
    title: KPI 통합
    description: >
      보험 운영 의사결정을 위한 KPI 통합 뷰.
      fact_accident를 기준으로 모든 fact/dim 테이블을 join_path로 연결하여
      손해율·청구인용율·SLA준수율 등 모든 KPI와 드라이버 차원을 kpi.* 단일 prefix로 조회 가능.
      수익성(P), 지급품질(Q), 운영효율(E) 세 축으로 분석한다.

    cubes:
      # ── fact_accident (기준 큐브) ─────────────────────────────────────────
      - join_path: fact_accident
        includes:
          - name: count
            alias: claim_count

          - accident_dt
          - claim_dt
          - payment_dt
          - accident_type_l1
          - accident_type_l2
          - accident_type_l3
          - accident_claim_gap_days
          - prior_claim_grp

          - name: loss_ratio
            meta:
              kpi:
                visible: true
                target: "40% 이하"
              driver:
                - dimension: accident_type_l1
                  measure: claim_count
                - dimension: coverage_nm
                  measure: avg_payment_amt
                - dimension: adjuster_id
                  measure: claim_approval_rate
              lever:
                - action: "고위험 담보 인수기준 강화"
                - action: "과지급 탐지 강화"
                - action: "심사자 배당 정책 조정"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: claim_approval_rate
            meta:
              kpi:
                visible: true
                target: "85~90%"
              driver:
                - dimension: coverage_nm
                  measure: claim_approval_rate
                - dimension: adjuster_id
                  measure: claim_approval_rate
                - dimension: hospital_nm
                  measure: claim_approval_rate
              lever:
                - action: "coverage별 지급기준 명확화"
                - action: "심사자 교육"
                - action: "과잉청구 병원 관리"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: overpayment_rate
            meta:
              kpi:
                visible: true
                target: "2% 이하"
              driver:
                - dimension: adjuster_id
                  measure: overpayment_rate
                - dimension: claim_center_nm
                  measure: overpayment_rate
                - dimension: accident_type_l1
                  measure: overpayment_rate
              lever:
                - action: "과지급 다발 심사자 재교육"
                - action: "이중심사 도입"
                - action: "환수 프로세스 강화"
              pre_aggregation:
                time_dimension: payment_dt
                granularity: month

          - name: sla_compliance_rate
            meta:
              kpi:
                visible: true
                target: "95% 이상"
              driver:
                - dimension: adjuster_id
                  measure: avg_processing_days
                - dimension: claim_team_nm
                  measure: avg_processing_days
                - dimension: org_type
                  measure: avg_processing_days
                - dimension: accident_type_l1
                  measure: avg_processing_days
              lever:
                - action: "간편심사 확대"
                - action: "심사자 배당 정책 개선"
                - action: "저준수 팀 인력 보강"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - name: avg_processing_days
            meta:
              kpi:
                visible: true
                target: "5일 이내"
              driver:
                - dimension: adjuster_id
                  measure: avg_processing_days
                - dimension: claim_team_nm
                  measure: avg_processing_days
                - dimension: org_type
                  measure: avg_processing_days
              lever:
                - action: "처리지연 심사자 건수 재배분"
                - action: "특정 사고유형 간편심사 전환"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - name: anomaly_rate
            meta:
              kpi:
                visible: true
              driver:
                - dimension: anomaly_label
                  measure: anomaly_rate
                - dimension: claim_center_nm
                  measure: anomaly_rate
              lever:
                - action: "고탐지율 센터 집중 감사"
                - action: "이상유형별 심사 프로세스 강화"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - name: fraud_suspicion_rate
            meta:
              kpi:
                visible: true
                target: "1% 이하"
              driver:
                - dimension: prior_claim_grp
                  measure: fraud_suspicion_rate
                - dimension: hospital_nm
                  measure: fraud_suspicion_rate
                - dimension: treatment_pattern
                  measure: fraud_suspicion_rate
              lever:
                - action: "SIU 배정"
                - action: "지급 보류 처리"
                - action: "의심 병원 집중심사"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - name: noninsured_ratio
            meta:
              kpi:
                visible: true
              driver:
                - dimension: hospital_nm
                  measure: noninsured_ratio
                - dimension: dx_analysis_l1
                  measure: noninsured_ratio
                - dimension: treatment_pattern
                  measure: noninsured_ratio
              lever:
                - action: "비급여 과다 병원 집중심사"
                - action: "현장 조사"
                - action: "비급여 항목별 지급기준 강화"
              pre_aggregation:
                time_dimension: claim_dt
                granularity: month

          - review_reversal_count

          - name: review_reversal_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: adjuster_id
                  measure: review_reversal_count
                - dimension: coverage_nm
                  measure: review_reversal_count
              lever:
                - action: "번복 다발 심사자 재교육"
                - action: "담보별 심사 가이드라인 보완"

          - name: high_prior_claim_count
            meta:
              kpi:
                visible: false
              driver:
                - dimension: hospital_nm
                  measure: high_prior_claim_count
                - dimension: dx_analysis_l1
                  measure: high_prior_claim_count
              lever:
                - action: "상습청구 고객 집중심사 지정"
                - action: "SIU 조사 의뢰"

      # ── fact_payment ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_payment
        includes:
          - total_payment_amt
          - total_claim_amt
          - total_reduction_amt
          - avg_payment_amt
          - reduction_count
          - name: reduction_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: coverage_nm
                  measure: reduction_rate
                - dimension: reduction_reason
                  measure: total_reduction_amt
              lever:
                - action: "감액 집중 담보 지급기준 명확화"
          - final_payment_cd
          - payment_type
          - payment_item_l1
          - reduction_reason

      # ── fact_contract ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract
        includes:
          - total_insured_amt
          - sales_division
          - sales_org_cd
          - product_cd
          - coverage_cd

      # ── fact_review ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_review
        includes:
          - claim_center_nm
          - claim_team_nm
          - adjuster_id
          - org_type
          - anomaly_label
          - review_yn
          - lawsuit_yn

          - name: payment_delay_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: claim_center_nm
                  measure: avg_processing_days
                - dimension: accident_type_l1
                  measure: avg_processing_days
              lever:
                - action: "자동화 대상 사고유형 선정"
                - action: "간편심사 확대"

          - name: review_rate
            meta:
              kpi:
                visible: false
                target: "3% 이하"
              driver:
                - dimension: adjuster_id
                  measure: review_rate
                - dimension: coverage_nm
                  measure: review_rate
              lever:
                - action: "심사기준 명확화"
                - action: "과소지급 심사자 모니터링"
                - action: "심사 결과 커뮤니케이션 강화"

          - name: lawsuit_rate
            meta:
              kpi:
                visible: false
                target: "1% 이하"
              driver:
                - dimension: coverage_nm
                  measure: lawsuit_rate
                - dimension: claim_center_nm
                  measure: lawsuit_rate
                - dimension: review_yn
                  measure: lawsuit_rate
              lever:
                - action: "소송 집중 담보 지급기준 재정비"
                - action: "분쟁 조기 해소 프로세스 강화"

          - name: duplicate_payment_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: adjuster_id
                  measure: duplicate_payment_rate
                - dimension: claim_center_nm
                  measure: duplicate_payment_rate
              lever:
                - action: "중복지급 발생 단위 프로세스 점검"
                - action: "시스템 자동 중복 검증 강화"

          - name: error_payment_rate
            meta:
              kpi:
                visible: false
              driver:
                - dimension: adjuster_id
                  measure: error_payment_rate
                - dimension: coverage_nm
                  measure: error_payment_rate
              lever:
                - action: "면책조항 미적용 오류 심사자 교육"
                - action: "지급 계산 자동화 확대"

      # ── fact_treatment ────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment
        includes:
          - dx_analysis_l1
          - dx_analysis_l2
          - treatment_pattern
          - inpatient_period_grp
          - avg_inpatient_days
          - total_treat_amt_noninsured

      # ── dim_customer ──────────────────────────────────────────────────────
      - join_path: fact_accident.dim_customer
        includes:
          - gender
          - age_group

      # ── dim_coverage ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_coverage
        includes:
          - coverage_nm
          - coverage_type
          - coverage_cat1
          - coverage_cat2

      # ── dim_product ───────────────────────────────────────────────────────
      - join_path: fact_accident.fact_contract.dim_product
        includes:
          - product_nm

      # ── dim_hospital ──────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_hospital
        includes:
          - hospital_nm
          - hospital_grade_cd

      # ── dim_diagnosis ─────────────────────────────────────────────────────
      - join_path: fact_accident.fact_treatment.dim_diagnosis
        includes:
          - diagnosis_nm
          - diagnosis_type
