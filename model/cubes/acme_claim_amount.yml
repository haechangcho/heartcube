cubes:
  - name: acme_claim_amount
    public: false
    sql_table: oda_benchmark.acme_claim_amount

    joins:
      - name: acme_loss_payment
        sql: "{acme_claim_amount}.claim_amount_identifier = {acme_loss_payment}.claim_amount_identifier"
        relationship: one_to_one

      - name: acme_loss_reserve
        sql: "{acme_claim_amount}.claim_amount_identifier = {acme_loss_reserve}.claim_amount_identifier"
        relationship: one_to_one

      - name: acme_expense_payment
        sql: "{acme_claim_amount}.claim_amount_identifier = {acme_expense_payment}.claim_amount_identifier"
        relationship: one_to_one

      - name: acme_expense_reserve
        sql: "{acme_claim_amount}.claim_amount_identifier = {acme_expense_reserve}.claim_amount_identifier"
        relationship: one_to_one

    dimensions:
      - name: claim_amount_identifier
        sql: claim_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: amount_type_code
        sql: amount_type_code
        type: string

      - name: insurance_type_code
        sql: insurance_type_code
        type: string

      - name: event_date
        sql: "CAST(event_date AS DATE)"
        type: time

    measures:
      - name: total_claim_amount
        sql: claim_amount
        type: sum
        title: Total Claim Amount

      - name: loss_payment_amount
        sql: claim_amount
        type: sum
        title: Loss Payment Amount
        filters:
          - sql: "EXISTS (SELECT 1 FROM oda_benchmark.acme_loss_payment lp WHERE lp.claim_amount_identifier = {CUBE}.claim_amount_identifier)"

      - name: loss_reserve_amount
        sql: claim_amount
        type: sum
        title: Loss Reserve Amount
        filters:
          - sql: "EXISTS (SELECT 1 FROM oda_benchmark.acme_loss_reserve lr WHERE lr.claim_amount_identifier = {CUBE}.claim_amount_identifier)"

      - name: expense_payment_amount
        sql: claim_amount
        type: sum
        title: Expense Payment Amount
        filters:
          - sql: "EXISTS (SELECT 1 FROM oda_benchmark.acme_expense_payment ep WHERE ep.claim_amount_identifier = {CUBE}.claim_amount_identifier)"

      - name: expense_reserve_amount
        sql: claim_amount
        type: sum
        title: Expense Reserve Amount
        filters:
          - sql: "EXISTS (SELECT 1 FROM oda_benchmark.acme_expense_reserve er WHERE er.claim_amount_identifier = {CUBE}.claim_amount_identifier)"

      - name: total_loss_amount
        sql: "{loss_payment_amount} + {loss_reserve_amount}"
        type: number
        title: Total Loss Amount
        description: "Sum of loss_payment_amount and loss_reserve_amount"

      - name: total_full_loss_amount
        sql: "{loss_payment_amount} + {loss_reserve_amount} + {expense_payment_amount} + {expense_reserve_amount}"
        type: number
        title: Total Full Loss Amount
        description: "Sum of loss payment, loss reserve, expense payment, and expense reserve amounts."
