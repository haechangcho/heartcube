cubes:
  - name: acme_loss_payment
    public: false
    sql_table: oda_benchmark.acme_loss_payment
    description: "Table containing loss_payment information."

    dimensions:
      - name: claim_amount_identifier
        sql: claim_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: has_loss_payment
        sql: "1"
        type: string
        description: "Filter on this to determine if row represents a loss payment. Filter should evaluate to 'has_loss_payment = 1'."
