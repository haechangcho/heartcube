cubes:
  - name: fact_accident
    public: false
    sql_table: oda.fact_accident
    data_source: default

    title: 사고 기본
    description: >
      보험 사고 1건을 1행으로 표현하는 핵심 팩트 테이블.
      사고일자·청구일자·지급일자를 모두 포함하며, 고객/치료/지급/심사/계약 큐브와
      accident_no 를 통해 조인된다.
      분석 시 기준 날짜는 accident_dt(사고일자)를 사용하는 것을 원칙으로 한다.

    joins:
      - name: dim_customer
        sql: "{fact_accident}.customer_id = {dim_customer}.customer_id"
        relationship: many_to_one

      - name: fact_treatment
        sql: "{fact_accident}.accident_no = {fact_treatment}.accident_no"
        relationship: one_to_one

      - name: fact_payment
        sql: "{fact_accident}.accident_no = {fact_payment}.accident_no"
        relationship: one_to_one

      - name: fact_review
        sql: "{fact_accident}.accident_no = {fact_review}.accident_no"
        relationship: one_to_one

      - name: fact_contract
        sql: "{fact_accident}.accident_no = {fact_contract}.accident_no"
        relationship: one_to_one

    dimensions:
      - name: accident_no
        sql: accident_no
        type: string
        title: 사고번호
        description: 사고 건의 고유 식별자.
        primary_key: true
        public: false

      - name: accident_dt
        sql: "CAST({CUBE}.accident_dt AS DATE)"
        type: time
        title: 사고일자
        description: >
          사고가 발생한 날짜. 시계열 분석의 기본 기준 날짜.
          월별·분기별 트렌드 분석에 사용한다.

      - name: claim_dt
        sql: "CAST({CUBE}.claim_dt AS DATE)"
        type: time
        title: 청구일자
        description: 고객이 보험금을 청구한 날짜.

      - name: payment_dt
        sql: "CAST({CUBE}.payment_dt AS DATE)"
        type: time
        title: 지급일자
        description: 보험금이 최종 지급된 날짜.

      - name: accident_type_l1
        sql: accident_type_l1
        type: string
        title: 사고유형(대)
        description: >
          사고의 대분류. 교통·상해·질병 3종으로 구성.
          전체 사고 구성비 분석 시 첫 번째 필터 기준으로 사용.
        meta:
          values: [교통, 상해, 질병]

      - name: accident_type_l2
        sql: accident_type_l2
        type: string
        title: 사고유형(중)
        description: 사고 중분류. accident_type_l1의 하위 분류.

      - name: accident_type_l3
        sql: accident_type_l3
        type: string
        title: 사고유형(소)
        description: 사고 소분류. 가장 세분화된 유형.

      - name: customer_id
        sql: customer_id
        type: string
        title: 고객ID
        description: 고객 식별자. 특정 고객 필터링 시 사용.
        public: false

      - name: prior_claim_grp
        sql: >
          CASE
            WHEN {CUBE}.prior_claim_cnt = 0 THEN '0회'
            WHEN {CUBE}.prior_claim_cnt BETWEEN 1 AND 2 THEN '1-2회'
            WHEN {CUBE}.prior_claim_cnt >= 3 THEN '3회 이상'
          END
        type: string
        title: 이전청구횟수구간
        description: 고객의 이전 청구 횟수 구간. 3회 이상은 상습청구 고객으로 분류.

      - name: accident_claim_gap_days
        sql: accident_claim_gap_days
        type: number
        title: 사고-청구 간격(일)
        description: >
          사고 발생일부터 청구일까지의 경과일수.
          값이 클수록 지연 청구로 사기 의심 가능성이 높아진다.

    measures:
      - name: count
        type: count
        title: 사고 건수
        description: 전체 사고 접수 건수.
      
      - name: loss_ratio
        type: number
        title: 손해율(%)
        description: >
          보험가입금액 대비 지급결정금액 비율.
          지급결정금액 합계 ÷ 보험가입금액 합계 × 100.
        sql: "100.0 * {fact_payment.total_payment_amt} / NULLIF({fact_contract.total_insured_amt}, 0)"
        format: percent
          
      - name: traffic_count
        type: count
        title: 교통사고 건수
        description: 사고유형(대) = 교통 인 건수.
        filters:
          - sql: "{CUBE}.accident_type_l1 = '교통'"

      - name: disease_count
        type: count
        title: 질병사고 건수
        filters:
          - sql: "{CUBE}.accident_type_l1 = '질병'"

      - name: injury_count
        type: count
        title: 상해사고 건수
        filters:
          - sql: "{CUBE}.accident_type_l1 = '상해'"

      - name: prior_claim_total
        sql: prior_claim_cnt
        type: sum
        title: 이전청구횟수 합계
        description: >
          이번 사고 이전에 해당 고객이 청구한 누적 횟수의 합.
          높을수록 상습 청구 고객 집중 여부를 파악하는 지표로 활용.

      - name: avg_claim_gap_days
        sql: accident_claim_gap_days
        type: avg
        title: 평균 사고-청구 간격(일)
        description: 사고 발생 후 청구까지 평균 소요일수.

      - name: payment_rate
        type: number
        title: 건당 평균 지급액
        description: >
          지급결정금액 합계 ÷ 사고 건수.
          전체 사고 중 평균 지급 규모를 파악한다.
        sql: "{fact_payment.total_payment_amt} / NULLIF({count}, 0)"
        format: currency

      - name: claim_approval_rate
        type: number
        title: 청구인용율(%)
        description: >
          지급결정금액 합계 ÷ 청구금액 합계.
          청구된 금액 중 실제 지급이 승인된 비율.
        sql: "100.0 * {fact_payment.total_payment_amt} / NULLIF({fact_payment.total_claim_amt}, 0)"
        format: percent

      - name: anomaly_rate
        type: number
        title: 이상징후 비율(%)
        description: >
          전체 사고 중 이상유형라벨이 '정상' 이 아닌 건의 비율.
          보험사기·과지급·착오지급 등 이상 건 탐지 모니터링 지표.
        sql: "100.0 * {fact_review.anomaly_count} / NULLIF({count}, 0)"
        format: percent


      - name: overpayment_rate
        type: number
        title: 과지급율(%)
        description: "전체 사고 중 이상유형라벨이 과지급인 건의 비율."
        sql: "100.0 * {fact_review.overpayment_count} / NULLIF({count}, 0)"
        format: percent


      - name: sla_compliance_rate
        type: number
        title: SLA준수율(%)
        description: "청구 후 5영업일 이내 처리된 건의 비율."
        sql: "100.0 * ({count} - {fact_review.sla_breach_count}) / NULLIF({count}, 0)"
        format: percent

      - name: avg_processing_days
        type: number
        title: 평균 처리기간(영업일)
        description: "사고 접수부터 보상 완료까지 평균 영업일수. SLA 기준: 5일."
        sql: "{fact_review.total_processing_days} / NULLIF({count}, 0)"
        format: number

      - name: noninsured_ratio
        type: number
        title: 비급여 비율(%)
        description: "총 치료비 대비 비급여 치료비 비율."
        sql: "100.0 * {fact_treatment.total_treat_amt_noninsured} / NULLIF({fact_treatment.total_treat_amt_insured} + {fact_treatment.total_treat_amt_noninsured}, 0)"
        format: percent

      - name: fraud_suspicion_rate
        type: number
        title: 사기의심율(%)
        description: "전체 사고 중 사기의심 건의 비율."
        sql: "100.0 * {fact_review.fraud_suspect_count} / NULLIF({count}, 0)"
        format: percent

      - name: review_reversal_count
        type: count
        title: 재심번복 건수
        description: "재심(review_yn=Y) 후 실제 지급액이 기준금액을 초과한 건수"
        sql: "CASE WHEN {fact_review.review_yn} = 'Y' AND {fact_payment.payment_amt} > {fact_review.baseline_amt} THEN {CUBE}.accident_no END"

      - name: review_reversal_rate
        type: number
        title: 재심번복율(%)
        description: "재심 건 중 추가지급(번복)으로 이어진 비율"
        sql: "100.0 * {review_reversal_count} / NULLIF({fact_review.review_count}, 0)"
        format: percent

      - name: high_prior_claim_count
        type: count
        title: 상습청구건수(3회 이상)
        description: "과거 청구 3회 이상 고객의 청구 건수. 상습 청구 탐지 Driver"
        sql: "CASE WHEN {CUBE}.prior_claim_cnt >= 3 THEN {CUBE}.accident_no END"
    pre_aggregations:
      - name: daily_accident_rollup
        type: rollup
        measures:
          - count
          - prior_claim_total
          - avg_claim_gap_days
          - fact_review.anomaly_count
        dimensions:
          - accident_type_l1
        time_dimension: accident_dt
        granularity: day
        partition_granularity: month
        refresh_key:
          every: 1 hour
      - name: monthly_loss_ratio_rollup
        type: rollup
        measures:
          - fact_payment.total_payment_amt
          - fact_contract.total_insured_amt
          - fact_payment.total_claim_amt
          - fact_review.overpayment_count
          - count
        time_dimension: payment_dt
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 1 hour
      - name: monthly_sla_rollup
        type: rollup
        measures:
          - fact_review.sla_breach_count
          - fact_review.anomaly_count
          - fact_treatment.total_treat_amt_noninsured
          - fact_treatment.total_treat_amt_insured
          - count
        time_dimension: claim_dt
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 1 hour
      - name: monthly_payment_kpi_rollup
        type: rollup
        measures:
          - fact_review.total_processing_days
          - fact_review.fraud_suspect_count
          - review_reversal_count
          - fact_review.review_count
          - count
        time_dimension: payment_dt
        granularity: month
        partition_granularity: year
        refresh_key:
          every: 1 hour
