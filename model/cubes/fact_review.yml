cubes:
  - name: fact_review
    public: false
    sql_table: oda.fact_review
    data_source: default

    title: 심사 및 이상탐지
    description: >
      청구 심사 과정 및 이상 탐지 결과. SLA 준수율·과지급율 등 지급 품질 KPI 원천.

    joins: []

    dimensions:
      - name: accident_no
        sql: accident_no
        type: string
        title: 사고번호
        primary_key: true
        public: false

      - name: review_yn
        sql: review_yn
        type: string
        title: 재심여부
        description: Y = 재심 청구 발생

      - name: lawsuit_yn
        sql: lawsuit_yn
        type: string
        title: 소송여부
        description: Y = 소송 제기

      - name: org_type
        sql: org_type
        type: string
        title: 조직구분
        description: 보상부 / CAS / 간편심사 등

      - name: claim_center_nm
        sql: claim_center_nm
        type: string
        title: 보상센터명
        description: 담당 보상센터명.

      - name: claim_team_nm
        sql: claim_team_nm
        type: string
        title: 보상팀명
        description: 보상센터 내 담당 팀명.

      - name: adjuster_id
        sql: adjuster_id
        type: string
        title: 보상담당자사번
        description: 심사 담당자 사번.
        public: false
        mask:
          sql: "CONCAT('***', RIGHT({CUBE}.adjuster_id, 3))"

      - name: anomaly_label
        sql: anomaly_label
        type: string
        title: 이상유형라벨
        description: >
          보상 심사 결과 이상 여부 분류.
          정상·사기의심·과지급·과소지급·중복지급·착오지급 6종.
        meta:
          values: [정상, 사기의심, 과지급, 과소지급, 중복지급, 착오지급]


      - name: processing_biz_days
        sql: processing_biz_days
        type: number
        title: 처리기간(영업일)
        description: "사고 접수부터 보상 완료까지 영업일수. SLA 기준: 5일"

      - name: sla_breached
        sql: "CASE WHEN processing_biz_days > 5 THEN 'Y' ELSE 'N' END"
        type: string
        title: SLA초과여부
        description: "처리기간이 SLA 기준(5영업일) 초과 시 Y"

      - name: baseline_amt
        sql: baseline_amt
        type: number
        title: 기준금액
        description: "심사 기준 금액 (재심번복 판단 기준)"
    measures:
      - name: count
        type: count
        title: 심사 건수
        description: 심사 처리 전체 건수. 각종 비율 지표의 분모.

      - name: anomaly_count
        type: count
        title: 이상징후 건수
        description: >
          이상유형라벨이 '정상' 이 아닌 건수.
          fact_accident.anomaly_rate 계산의 분자로 사용된다.
        filters:
          - sql: "{CUBE}.anomaly_label != '정상'"

      - name: fraud_suspect_count
        type: count
        title: 사기의심 건수
        description: "이상유형라벨 = '사기의심' 건수."
        filters:
          - sql: "{CUBE}.anomaly_label = '사기의심'"

      - name: review_count
        type: count
        title: 재심 건수
        description: "재심 청구 건수(review_yn = 'Y')."
        filters:
          - sql: "{CUBE}.review_yn = 'Y'"

      - name: lawsuit_count
        type: count
        title: 소송 건수
        filters:
          - sql: "{CUBE}.lawsuit_yn = 'Y'"

      - name: avg_processing_days
        sql: processing_biz_days::numeric
        type: avg
        title: 평균 처리기간(영업일)
        description: "사고 접수부터 보상 완료까지 평균 영업일수. SLA 기준: 5일"

      - name: total_processing_days
        sql: processing_biz_days::numeric
        type: sum
        title: 처리기간 합계(영업일)
        description: "평균 처리기간 계산을 위한 처리기간 합산값. avg_processing_days의 분자로 사용."
        public: false

      - name: total_baseline_amt
        sql: baseline_amt
        type: sum
        title: 기준금액 합계
        format: currency


      - name: overpayment_count
        type: count
        title: 과지급 건수
        description: "이상유형라벨 = '과지급' 건수."
        filters:
          - sql: "{CUBE}.anomaly_label = '과지급'"

      - name: overpayment_rate
        type: number
        title: 과지급율(%)
        description: "전체 심사 건 중 과지급 건 비율"
        sql: "100.0 * {overpayment_count} / NULLIF({count}, 0)"
        format: percent


      - name: sla_breach_count
        type: count
        title: SLA초과 건수
        description: "처리기간 5영업일 초과 건수"
        filters:
          - sql: "{CUBE}.processing_biz_days > 5"

      - name: sla_compliance_rate
        type: number
        title: SLA준수율(%)
        description: "SLA(5영업일) 이내 처리 건 비율"
        sql: "100.0 * ({count} - {sla_breach_count}) / NULLIF({count}, 0)"
        format: percent


      - name: review_reversal_count
        type: count
        title: 재심번복 건수
        description: "재심 후 추가지급(baseline_amt 초과)으로 전환된 건수"
        filters:
          - sql: "{CUBE}.review_yn = 'Y' AND {fact_payment.total_payment_amt} > {CUBE}.baseline_amt"

      - name: fraud_suspicion_rate
        type: number
        title: 사기의심율(%)
        description: "사기의심 탐지 건수 비율. 목표: 1% 이하"
        sql: "100.0 * {fraud_suspect_count} / NULLIF({count}, 0)"
        format: percent

      - name: review_rate
        type: number
        title: 재심율(%)
        description: "재심 청구 건수 비율. 목표: 3% 이하"
        sql: "100.0 * {review_count} / NULLIF({count}, 0)"
        format: percent

      - name: lawsuit_rate
        type: number
        title: 소송율(%)
        description: "소송 제기 건수 비율. 목표: 1% 이하"
        sql: "100.0 * {lawsuit_count} / NULLIF({count}, 0)"
        format: percent

      - name: payment_delay_rate
        type: number
        title: 지급지연율(%)
        description: "처리기간 5영업일 초과 건수 비율. SLA준수율의 역수"
        sql: "100.0 * {sla_breach_count} / NULLIF({count}, 0)"
        format: percent

      - name: duplicate_payment_count
        type: count
        title: 중복지급 건수
        filters:
          - sql: "{CUBE}.anomaly_label = '중복지급'"

      - name: duplicate_payment_rate
        type: number
        title: 중복지급율(%)
        description: "중복지급 탐지 건수 비율"
        sql: "100.0 * {duplicate_payment_count} / NULLIF({count}, 0)"
        format: percent

      - name: error_payment_count
        type: count
        title: 착오지급 건수
        filters:
          - sql: "{CUBE}.anomaly_label = '착오지급'"

      - name: error_payment_rate
        type: number
        title: 착오지급율(%)
        description: "착오지급 탐지 건수 비율"
        sql: "100.0 * {error_payment_count} / NULLIF({count}, 0)"
        format: percent
    pre_aggregations:
