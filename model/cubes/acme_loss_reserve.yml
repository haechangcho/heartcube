cubes:
  - name: acme_loss_reserve
    public: false
    sql_table: oda_benchmark.acme_loss_reserve
    description: "Table containing loss_reserve information."

    dimensions:
      - name: claim_amount_identifier
        sql: claim_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: has_loss_reserve
        sql: "1"
        type: string
        description: "Filter on this to determine if row represents a loss reserve. Filter should evaluate to 'has_loss_reserve = 1'."
