cubes:
  - name: acme_agreement_party_role
    public: false
    sql_table: oda_benchmark.acme_agreement_party_role

    joins:
      - name: acme_party
        sql: "{acme_agreement_party_role}.party_identifier = {acme_party}.party_identifier"
        relationship: many_to_one

    dimensions:
      - name: agreement_identifier
        sql: agreement_identifier
        type: number
        primary_key: true
        public: false

      - name: party_identifier
        sql: party_identifier
        type: number
        description: "Use this in coordination with filter on party_role_code to refer to agent_id or policyholder_id."

      - name: party_role_code
        sql: party_role_code
        type: string
        description: "Must filter using this dimension if referring to agents or policyholders. If party_role_code = 'PH' then Party_Identifier refers to policy_holder_id, if party_role_code = 'AG' then Party_Identifier refers to agent_id. Should be used in coordination with party_identifier"

      - name: effective_date
        sql: "CAST({CUBE}.effective_date AS DATE)"
        type: time

      - name: expiration_date
        sql: "CAST({CUBE}.expiration_date AS DATE)"
        type: time

    measures:
      - name: policy_count_by_agent
        sql: agreement_identifier
        type: count_distinct
        filters:
          - sql: "{CUBE}.party_role_code = 'AG'"
        title: Policy Count by Agent
