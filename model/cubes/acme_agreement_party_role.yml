cubes:
  - name: acme_agreement_party_role
    public: false
    sql_table: oda_benchmark.acme_agreement_party_role

    dimensions:
      - name: agreement_identifier
        sql: agreement_identifier
        type: number
        primary_key: true
        public: false

      - name: party_identifier
        sql: party_identifier
        type: number
        description: "Use this in coordination with filter on party_role_code to refer to agent_id or policyholder_id."

      - name: party_role_code
        sql: party_role_code
        type: string
        description: "Must filter using this dimension if referring to agents or policyholders. If party_role_code = 'PH' then party_identifier refers to policyholder_id, if party_role_code = 'AG' then party_identifier refers to agent_id."

      - name: effective_date
        sql: "CAST(effective_date AS DATE)"
        type: time

      - name: expiration_date
        sql: "CAST(expiration_date AS DATE)"
        type: time

    measures:
      - name: policy_count_by_agent
        sql: agreement_identifier
        type: count_distinct
        filters:
          - sql: "{CUBE}.party_role_code = 'AG'"
        title: Policy Count by Agent
