cubes:
  - name: acme_policy
    public: false
    sql_table: oda_benchmark.acme_policy
    description: "Table containing policy data."

    joins:
      - name: acme_agreement_party_role
        sql: "{acme_policy}.policy_identifier = {acme_agreement_party_role}.agreement_identifier"
        relationship: one_to_many

      - name: acme_policy_amount
        sql: "{acme_policy}.policy_identifier = {acme_policy_amount}.policy_identifier"
        relationship: one_to_many

    dimensions:
      - name: policy_identifier
        sql: policy_identifier
        type: number
        primary_key: true
        public: false

      - name: policy_number
        sql: policy_number
        type: string

      - name: status_code
        sql: status_code
        type: string

      - name: effective_date
        sql: "CAST({CUBE}.effective_date AS DATE)"
        type: time

      - name: expiration_date
        sql: "CAST({CUBE}.expiration_date AS DATE)"
        type: time

    measures:
      - name: number_of_policies
        type: count
        title: Number of Policies
        description: "The total number of policies."
