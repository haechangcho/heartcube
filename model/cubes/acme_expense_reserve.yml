cubes:
  - name: acme_expense_reserve
    public: false
    sql_table: oda_benchmark.acme_expense_reserve
    description: "Table containing expense_reserve information."

    dimensions:
      - name: claim_amount_identifier
        sql: claim_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: has_expense_reserve
        sql: "1"
        type: string
        description: "Filter on this to determine if row represents an expense reserve. Filter should evaluate to 'has_expense_reserve = 1'."
