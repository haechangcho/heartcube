cubes:
  - name: fact_payment
    public: false
    sql_table: oda.fact_payment
    data_source: default

    title: 지급 정보
    description: >
      보험금 청구 및 지급 상세 내역. 손해율·청구인용율 등 수익성 KPI의 원천.

    joins: []

    dimensions:
      - name: accident_no
        sql: accident_no
        type: string
        title: 사고번호
        primary_key: true
        public: false

      - name: claim_item
        sql: claim_item
        type: string
        title: 청구항목

      - name: final_payment_cd
        sql: final_payment_cd
        type: string
        title: 최종지급코드
        description: 정상지급·감액지급·일부지급

      - name: payment_type
        sql: payment_type
        type: string
        title: 지급유형
        description: 진단비·수술비·일당·손해실비·통원의료비·약제의료비·기타 등

      - name: payment_item_l1
        sql: payment_item_l1
        type: string
        title: 지급항목(대)
        description: 지급 항목 대분류.

      - name: payment_item_l2
        sql: payment_item_l2
        type: string
        title: 지급항목(중)

      - name: final_coverage_nm
        sql: final_coverage_nm
        type: string
        title: 최종담보명
        description: 실제 지급 시 적용된 담보명. 계약상 담보명(coverage_nm)과 다를 수 있음.

      - name: reduction_reason
        sql: reduction_reason
        type: string
        title: 감액사유
        description: 해당없음 / 과잉진료 / 중복청구 등


      - name: payment_amt
        sql: payment_amt
        type: number
        title: 지급결정금액
        description: "건별 지급결정금액 (재심번복 판단용)"
    measures:
      - name: count
        type: count
        title: 지급 건수
        description: 지급 처리된 건수.

      - name: total_claim_amt
        sql: claim_amt
        type: sum
        title: 청구금액 합계
        format: currency
        description: 고객이 청구한 총 금액.

      - name: total_payment_amt
        sql: payment_amt
        type: sum
        title: 지급결정금액 합계
        format: currency
        description: >
          최종 지급이 결정된 금액의 합계.
          손해율, 청구인용율의 분자로 사용된다.

      - name: total_loss_amt
        sql: loss_amt
        type: sum
        title: 손해액 합계
        format: currency
        description: 실제 발생한 손해 금액

      - name: total_reduction_amt
        sql: reduction_amt
        type: sum
        title: 감액 합계
        format: currency
        description: 청구금액 대비 감액된 금액 합계.

      - name: avg_payment_amt
        title: 평균지급금액
        sql: payment_amt
        type: avg
        description: 건당 평균 지급 결정 금액.

      - name: payment_rate
        type: number
        title: 청구인용율(%)
        description: "지급결정금액 / 청구금액"
        sql: "100.0 * {total_payment_amt} / NULLIF({total_claim_amt}, 0)"
        format: percent

      - name: normal_payment_count
        type: count
        title: 정상지급 건수
        filters:
          - sql: "{CUBE}.final_payment_cd = '정상지급'"

      - name: reduction_count
        type: count
        title: 감액지급 건수
        description: "감액지급(final_payment_cd = '감액지급') 건수."
        filters:
          - sql: "{CUBE}.final_payment_cd = '감액지급'"

      - name: reduction_rate
        type: number
        title: 감액율(%)
        description: "감액금액 / 청구금액 × 100. 과잉청구 규모의 간접 지표"
        sql: "100.0 * {total_reduction_amt} / NULLIF({total_claim_amt}, 0)"
        format: percent
    pre_aggregations:
