cubes:
  - name: acme_policy_amount
    public: false
    sql_table: oda_benchmark.acme_policy_amount
    description: "A model representing the amounts associated with insurance policies, including details of the policy coverage and the insured object."

    joins:
      - name: acme_premium
        sql: "{acme_policy_amount}.policy_amount_identifier = {acme_premium}.policy_amount_identifier"
        relationship: one_to_one

    dimensions:
      - name: policy_amount_identifier
        sql: policy_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: amount_type_code
        sql: amount_type_code
        type: string

      - name: effective_date
        sql: "CAST(effective_date AS DATE)"
        type: time

    measures:
      - name: total_policy_amount
        sql: policy_amount
        type: sum
        title: Total Policy Amount
        description: "The total amount associated with the policy."
