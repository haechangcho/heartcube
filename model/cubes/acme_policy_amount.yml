cubes:
  - name: acme_policy_amount
    public: false
    sql_table: oda.acme_policy_amount
    title: ACME 증권금액

    joins:
      - name: acme_premium
        sql: "{acme_policy_amount}.policy_amount_identifier = {acme_premium}.policy_amount_identifier"
        relationship: one_to_one

    dimensions:
      - name: policy_amount_identifier
        sql: policy_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: amount_type_code
        sql: amount_type_code
        type: string
        title: 금액유형코드

      - name: effective_date
        sql: "CAST(effective_date AS DATE)"
        type: time
        title: 적용개시일

    measures:
      - name: total_policy_amount
        sql: policy_amount
        type: sum
        title: 총증권금액

      - name: premium_amount
        sql: "CASE WHEN {acme_premium}.policy_amount_identifier IS NOT NULL THEN policy_amount ELSE 0 END"
        type: sum
        title: 보험료 합계
