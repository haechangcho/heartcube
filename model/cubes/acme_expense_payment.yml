cubes:
  - name: acme_expense_payment
    public: false
    sql_table: oda_benchmark.acme_expense_payment
    description: "Table containing expense_payment information."

    dimensions:
      - name: claim_amount_identifier
        sql: claim_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: has_expense_payment
        sql: "1"
        type: string
        description: "Filter on this to determine if row represents an expense payment. Filter should evaluate to 'has_expense_payment = 1'."
