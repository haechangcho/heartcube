cubes:
  - name: acme_person
    public: false
    sql_table: oda_benchmark.acme_person
    description: "A table containing person names and demographic attributes."

    dimensions:
      - name: person_identifier
        sql: person_identifier
        type: number
        primary_key: true
        public: false

      - name: first_name
        sql: first_name
        type: string

      - name: middle_name
        sql: middle_name
        type: string

      - name: last_name
        sql: last_name
        type: string

      - name: full_legal_name
        sql: "COALESCE(NULLIF(full_legal_name, ''), TRIM(CONCAT_WS(' ', first_name, middle_name, last_name)))"
        type: string
        description: "Full person name. Falls back to first, middle, and last name when full_legal_name is empty."

      - name: nickname
        sql: nickname
        type: string

      - name: birth_date
        sql: "CAST({CUBE}.birth_date AS DATE)"
        type: time

      - name: gender_code
        sql: gender_code
        type: string
