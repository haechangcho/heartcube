cubes:
  - name: dim_product
    public: false
    sql_table: oda.dim_product
    data_source: default

    title: 상품
    description: >
      보험 상품 차원 테이블. 상품코드·상품명을 포함한다.
      fact_contract 와 product_cd 로 조인하여 상품별 계약·사고·지급 분석에 활용한다.

    joins: []

    dimensions:
      - name: product_cd
        sql: product_cd
        type: string
        title: 상품코드
        primary_key: true
        public: false

      - name: product_nm
        sql: product_nm
        type: string
        title: 상품명
        description: 보험 상품의 정식 명칭.

    measures:
      - name: count
        type: count
        title: 상품 수

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
