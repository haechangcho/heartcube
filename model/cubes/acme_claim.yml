cubes:
  - name: acme_claim
    public: false
    sql_table: oda_benchmark.acme_claim

    joins:
      - name: acme_catastrophe
        sql: "{acme_claim}.catastrophe_identifier = {acme_catastrophe}.catastrophe_identifier"
        relationship: many_to_one

      - name: acme_claim_amount
        sql: "{acme_claim}.claim_identifier = {acme_claim_amount}.claim_identifier"
        relationship: one_to_many

      - name: acme_claim_coverage
        sql: "{acme_claim}.claim_identifier = {acme_claim_coverage}.claim_identifier"
        relationship: one_to_many

    dimensions:
      - name: claim_identifier
        sql: claim_identifier
        type: number
        primary_key: true
        public: false

      - name: company_claim_number
        sql: company_claim_number
        type: string
        description: "Unique claim identifier assigned by the company."

      - name: company_subclaim_number
        sql: company_subclaim_number
        type: string

      - name: claim_description
        sql: claim_description
        type: string

      - name: claim_status_code
        sql: claim_status_code
        type: string
        description: "Current status of the claim."

      - name: claims_made_date
        sql: "CAST(claims_made_date AS DATE)"
        type: time
        description: "Date the claim was made."

      - name: claim_open_date
        sql: "CAST(claim_open_date AS DATE)"
        type: time
        description: "Date the claim was opened."

      - name: claim_close_date
        sql: "CAST(claim_close_date AS DATE)"
        type: time
        description: "Date the claim was closed."

      - name: claim_reopen_date
        sql: "CAST(claim_reopen_date AS DATE)"
        type: time

      - name: claim_reported_date
        sql: "CAST(claim_reported_date AS DATE)"
        type: time

    measures:
      - name: claims
        sql: company_claim_number
        type: count
        title: Claims
        description: "Total number of claims."

      - name: avg_days_to_settle
        sql: "EXTRACT(DAY FROM (claim_close_date - claim_open_date))"
        type: avg
        title: Avg Time to Settle Claim
        description: "Average number of days from claim open to claim close."
