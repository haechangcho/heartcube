cubes:
  - name: acme_premium
    public: false
    sql_table: oda_benchmark.acme_premium
    description: "Table containing premium information."

    dimensions:
      - name: policy_amount_identifier
        sql: policy_amount_identifier
        type: number
        primary_key: true
        public: false

      - name: has_premium
        sql: "1"
        type: string
        description: "Filter on this to determine if row represents a premium. Filter should evaluate to 'has_premium = 1'."
