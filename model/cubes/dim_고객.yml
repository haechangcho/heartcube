cubes:
  - name: dim_ko_customer
    sql_table: 'oda. + table_name + '
    data_source: default

    joins: []

    dimensions:
      - name: customer_id
        sql: '{CUBE}. + col + '
        type: string
        title: 고객ID
        primary_key: true

      - name: gender
        sql: '{CUBE}. + col + '
        type: string
        title: 성별

      - name: birth_dt
        sql: '{CUBE}. + col + '
        type: string
        title: 생년월일

    measures:
      - name: count
        type: count

    pre_aggregations:
