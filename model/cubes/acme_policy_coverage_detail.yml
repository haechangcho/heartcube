cubes:
  - name: acme_policy_coverage_detail
    public: false
    sql_table: oda.acme_policy_coverage_detail
    title: ACME 증권담보상세

    joins:
      - name: acme_policy
        sql: "{acme_policy_coverage_detail}.policy_identifier = {acme_policy}.policy_identifier"
        relationship: many_to_one

    dimensions:
      - name: policy_coverage_detail_identifier
        sql: policy_coverage_detail_identifier
        type: number
        primary_key: true
        public: false

      - name: coverage_part_code
        sql: coverage_part_code
        type: string
        title: 담보구분코드

      - name: coverage_description
        sql: coverage_description
        type: string
        title: 담보설명

      - name: effective_date
        sql: "CAST(effective_date AS DATE)"
        type: time
        title: 담보개시일

      - name: expiration_date
        sql: "CAST(expiration_date AS DATE)"
        type: time
        title: 담보만료일
