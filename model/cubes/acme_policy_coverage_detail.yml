cubes:
  - name: acme_policy_coverage_detail
    public: false
    sql_table: oda_benchmark.acme_policy_coverage_detail
    description: "Coverage details of policies including effective dates, descriptions, and identifiers."

    joins:
      - name: acme_policy
        sql: "{acme_policy_coverage_detail}.policy_identifier = {acme_policy}.policy_identifier"
        relationship: many_to_one

    dimensions:
      - name: policy_coverage_detail_identifier
        sql: policy_coverage_detail_identifier
        type: number
        primary_key: true
        public: false

      - name: coverage_part_code
        sql: coverage_part_code
        type: string

      - name: coverage_description
        sql: coverage_description
        type: string

      - name: effective_date
        sql: "CAST({CUBE}.effective_date AS DATE)"
        type: time

      - name: expiration_date
        sql: "CAST({CUBE}.expiration_date AS DATE)"
        type: time
