cubes:
  - name: fact_ko_accident
    sql_table: 'oda. + table_name + '
    data_source: default

    joins: []

    dimensions:
      - name: accident_no
        sql: '{CUBE}. + col + '
        type: string
        title: 사고번호
        primary_key: true

      - name: accident_dt
        sql: '{CUBE}. + col + '
        type: string
        title: 사고일자

      - name: claim_dt
        sql: '{CUBE}. + col + '
        type: string
        title: 청구일자

      - name: payment_dt
        sql: '{CUBE}. + col + '
        type: string
        title: 지급일자

      - name: customer_id
        sql: '{CUBE}. + col + '
        type: string
        title: 고객ID

      - name: accident_type_l1
        sql: '{CUBE}. + col + '
        type: string
        title: 사고유형대분류

      - name: accident_type_l2
        sql: '{CUBE}. + col + '
        type: string
        title: 사고유형중분류

      - name: accident_type_l3
        sql: '{CUBE}. + col + '
        type: string
        title: 사고유형소분류

    measures:
      - name: count
        type: count

    pre_aggregations:
