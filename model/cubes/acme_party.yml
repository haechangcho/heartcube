cubes:
  - name: acme_party
    public: false
    sql_table: oda_benchmark.acme_party
    description: "A table containing party information, including party name and party type."

    joins:
      - name: acme_person
        sql: "{acme_party}.party_identifier = {acme_person}.person_identifier"
        relationship: one_to_one

    dimensions:
      - name: party_identifier
        sql: party_identifier
        type: number
        primary_key: true
        public: false

      - name: party_name
        sql: party_name
        type: string
        description: "Name associated with the party when available."

      - name: party_type_code
        sql: party_type_code
        type: string

      - name: begin_date
        sql: "CAST({CUBE}.begin_date AS DATE)"
        type: time

      - name: end_date
        sql: "CAST({CUBE}.end_date AS DATE)"
        type: time
