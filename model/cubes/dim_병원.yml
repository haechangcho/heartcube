cubes:
  - name: dim_ko_hospital
    sql_table: 'oda. + table_name + '
    data_source: default

    joins: []

    dimensions:
      - name: hospital_id
        sql: '{CUBE}. + col + '
        type: string
        title: 병원ID
        primary_key: true

      - name: hospital_nm
        sql: '{CUBE}. + col + '
        type: string
        title: 진단병원명

      - name: hospital_grade_cd
        sql: '{CUBE}. + col + '
        type: string
        title: 진단병원등급코드

    measures:
      - name: count
        type: count

    pre_aggregations:
