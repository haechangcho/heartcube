cubes:
  - name: fact_ko_payment
    sql_table: 'oda. + table_name + '
    data_source: default

    joins: []

    dimensions:
      - name: accident_no
        sql: '{CUBE}. + col + '
        type: string
        title: 사고번호
        primary_key: true

      - name: claim_item
        sql: '{CUBE}. + col + '
        type: string
        title: 청구항목

      - name: reduction_reason
        sql: '{CUBE}. + col + '
        type: string
        title: 감액사유

      - name: final_payment_cd
        sql: '{CUBE}. + col + '
        type: string
        title: 최종지급코드

      - name: payment_type
        sql: '{CUBE}. + col + '
        type: string
        title: 지급유형

      - name: payment_item_l1
        sql: '{CUBE}. + col + '
        type: string
        title: 지급항목대분류

      - name: payment_item_l2
        sql: '{CUBE}. + col + '
        type: string
        title: 지급항목중분류

      - name: final_coverage_nm
        sql: '{CUBE}. + col + '
        type: string
        title: 최종담보

    measures:
      - name: count
        type: count

    pre_aggregations:
